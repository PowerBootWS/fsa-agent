services:
  postgres:
    image: postgres:15-alpine
    container_name: fsa-postgres
    env_file: ../.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Edmonton
      - PGTZ=America/Edmonton
    volumes:
      - fsa_postgres_data:/var/lib/postgresql/data
      # WAL archive for point-in-time recovery. Deliberately a LOCAL bind mount,
      # not the NFS share: if archive_command fails, Postgres stops recycling WAL
      # and pg_wal grows until the disk fills and the database stops. A flaky NFS
      # mount is exactly how that happens. A timer syncs this to /mnt/ovhbackup.
      - /var/backups/fsa-wal:/wal_archive
    networks:
      - fsa-network
    ports:
      - "5434:5432"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PARENT_DOMAIN=${PARENT_DOMAIN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PYTHON_SERVICE_URL=http://ai-service:5000
      - GHL_API_KEY=${GHL_API_KEY}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID}
      - MEDIA_DIR=/srv/fsa-media
      - LEARN_DOMAIN=${LEARN_DOMAIN}
      - LEGACY_DOMAIN=${LEGACY_DOMAIN}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GOOGLE_SMTP_USER=${GOOGLE_SMTP_USER}
      - GOOGLE_SMTP_PASS=${GOOGLE_SMTP_PASS}
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL}
      - PAPER_SWITCH_COOLDOWN_DAYS=${PAPER_SWITCH_COOLDOWN_DAYS}
      - SAVED_JOB_ARCHIVE_DAYS=${SAVED_JOB_ARCHIVE_DAYS}
      - QUIZ_PASSING_THRESHOLD=${QUIZ_PASSING_THRESHOLD}
      - DEACTIVATION_REQUIRES_CONFIRMATION=${DEACTIVATION_REQUIRES_CONFIRMATION}
      - DEACTIVATION_REVIEW_EMAIL=${DEACTIVATION_REVIEW_EMAIL}
      - USER_UPLOADS_DIR=/srv/fsa-user-uploads
      - TZ=America/Edmonton
    volumes:
      - ${FSA_MEDIA_DIR}:/srv/fsa-media:ro
      - ${FSA_USER_UPLOADS_DIR}:/srv/fsa-user-uploads
      - ${FSA_GENERATED_DOCS_DIR}:/srv/fsa-generated-documents:ro
    depends_on:
      - ai-service
    networks:
      - fsa-network
      - cloudflare
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=google/gemini-3-flash-preview
      - OPENROUTER_RESUME_MODEL=anthropic/claude-sonnet-5
      - USER_UPLOADS_DIR=/srv/fsa-user-uploads
      - GENERATED_DOCS_DIR=/srv/fsa-generated-documents
      - TZ=America/Edmonton
    volumes:
      - ${FSA_USER_UPLOADS_DIR}:/srv/fsa-user-uploads:ro
      - ${FSA_GENERATED_DOCS_DIR}:/srv/fsa-generated-documents
    networks:
      - fsa-network
    restart: unless-stopped

networks:
  fsa-network:
    driver: bridge
  cloudflare:
    external: true

volumes:
  fsa_postgres_data: