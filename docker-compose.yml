services:
  postgres:
    image: postgres:15-alpine
    container_name: fsa-postgres
    env_file:
      - /home/debian/.env.shared
      - /home/debian/fsa-agent/.env
    environment:
      - TZ=America/Edmonton
      - PGTZ=America/Edmonton
    volumes:
      - fsa_postgres_data:/var/lib/postgresql/data
      # WAL archive for point-in-time recovery. Deliberately a LOCAL bind mount,
      # not the NFS share: if archive_command fails, Postgres stops recycling WAL
      # and pg_wal grows until the disk fills and the database stops. A flaky NFS
      # mount is exactly how that happens. A timer syncs this to /mnt/ovhbackup.
      - /var/backups/fsa-wal:/wal_archive
    networks:
      - fsa-network
    ports:
      - "5434:5432"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./server/Dockerfile
      secrets:
        - github_token
    env_file:
      - /home/debian/.env.shared
      - /home/debian/fsa-agent/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PYTHON_SERVICE_URL=http://ai-service:5000
      - MEDIA_DIR=/srv/fsa-media
      - USER_UPLOADS_DIR=/srv/fsa-user-uploads
      - TZ=America/Edmonton
    volumes:
      - ${FSA_MEDIA_DIR}:/srv/fsa-media:ro
      - ${FSA_USER_UPLOADS_DIR}:/srv/fsa-user-uploads
      - ${FSA_GENERATED_DOCS_DIR}:/srv/fsa-generated-documents:ro
      # Gmail service-account key — the only outbound mail credential.
      - /home/debian/.secrets/support_gmail_sa.json:/home/debian/.secrets/support_gmail_sa.json:ro
    depends_on:
      - ai-service
    networks:
      - fsa-network
      - cloudflare
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    env_file:
      - /home/debian/.env.shared
      - /home/debian/fsa-agent/.env
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - OPENROUTER_MODEL=google/gemini-3-flash-preview
      - OPENROUTER_RESUME_MODEL=anthropic/claude-sonnet-5
      - USER_UPLOADS_DIR=/srv/fsa-user-uploads
      - GENERATED_DOCS_DIR=/srv/fsa-generated-documents
      - TZ=America/Edmonton
    volumes:
      - ${FSA_USER_UPLOADS_DIR}:/srv/fsa-user-uploads:ro
      - ${FSA_GENERATED_DOCS_DIR}:/srv/fsa-generated-documents
    networks:
      - fsa-network
    restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN

networks:
  fsa-network:
    driver: bridge
  cloudflare:
    external: true

volumes:
  fsa_postgres_data:
