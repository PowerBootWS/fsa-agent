<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Full Steam Ahead</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0D1117; color: #F4F5F7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .wrap { max-width: 360px; }
      .brand {
        color: #E8720C; font-weight: 700; font-size: 14px;
        letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 16px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #a8b4c0; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button {
        background: #E8720C; color: #fff; border: none; border-radius: 4px;
        font-size: 15px; font-weight: 600; padding: 11px 22px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Full Steam Ahead</div>
      <h1>You're offline</h1>
      <p>Your lessons, practice exams, and the AI tutor need an internet connection. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
